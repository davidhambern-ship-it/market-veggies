name: Import Characters hero artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-characters-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Characters hero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-fc44-81f6-983f-f76bc966ae42/raw?se=2026-10-07T17%3A26%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=29749be4-b2b6-5aa7-ba9c-e6055876c912&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T11%3A07%3A01Z&ske=2026-10-08T11%3A07%3A01Z&sks=b&skv=2026-02-06&sig=bRkL4xfgm/qRClg%2Bz5PoLoZLX0JWtSzoG93op/XYRqw%3D' -o assets/characters-hero-crew.png
          file assets/characters-hero-crew.png
      - name: Commit artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters-hero-crew.png
          git diff --cached --quiet && exit 0
          git commit -m "Add Characters hero artwork [skip ci]"
          git push
