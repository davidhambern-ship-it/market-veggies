name: Import Gingy character set

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-gingy-character-set.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved Gingy images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/characters/gingy
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/5be7a1bd-5416-4613-93f2-132df9b6bf0d.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGY1MWIxOTY4NTdlMmQwYSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY5Nzk0Mn0.a7tupptWWrsWq29j5EghjkeTvADLDstx6bL5NwebZHc' -o 'assets/characters/gingy/gingy-flavor-kick.png'
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/00ac206f-ebe9-4ac4-af44-6b104dfe3835.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzUyZDI3OTA5MzNiYjg5OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY2MjA5Nn0.5Aokh7mpR6LoS8VcDnszqqgXoF4I6OJc4KY2aSDuvmA' -o 'assets/characters/gingy/gingy-root-of-it-all.png'
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/5a79ed0b-d083-4a45-8055-bc95bb1ac3ae.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODhlNTAyMWE4ODM5ODZlYiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsImV4cCI6MTc5MTcwMTY1OH0.lZhYGi0M4jclzlSPYvldp8DE_ZThJ_cyGn0Bm4vbdig' -o 'assets/characters/gingy/gingy-warm-and-cozy.png'
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/70cfc3da-5fad-4ae0-aa79-4bfbde808053.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDljZjIwYmZmNGM2MzkwNiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTcwNTQwN30.tlZUm4hEZ1O2SkhFCe8Gpng0EEvglJOfJXyLaDGzs3I' -o 'assets/characters/gingy/gingy-kitchen-traveler.png'
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f000222b-c96e-429f-b574-f78c1685c2ed.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzVkMzE3YjA3Zjg4ZmJkMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsImV4cCI6MTc5MTY1MjkxMn0.eGRxMBbOJaNckS23verm5U6Z58EdqWgCQN8PZrLjtcs' -o 'assets/characters/gingy/gingy-fresh-or-ground.png'
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/38779629-927b-467e-82c5-5b0ae9316348.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTViNDgxMGZiMzk1YzQyZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsImV4cCI6MTc5MTY1NDE1OX0.NNI_MK7V0A7QgqDh2dGQ8yKd_385A9uh0TB1Zn6c3bA' -o 'assets/characters/gingy/gingy-small-but-mighty.png'
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          folder = Path('assets/characters/gingy')
          expected = ["gingy-flavor-kick.png","gingy-root-of-it-all.png","gingy-warm-and-cozy.png","gingy-kitchen-traveler.png","gingy-fresh-or-ground.png","gingy-small-but-mighty.png"]
          for name in expected:
              data = (folder / name).read_bytes()
              assert len(data) > 1000000, f'PNG too small: {name}'
              assert data[:8] == bytes.fromhex('89504e470d0a1a0a'), f'Not PNG: {name}'
              width, height = unpack('>II', data[16:24])
              assert (width, height) == (1122,1402), f'Unexpected PNG size: {name} - {width}x{height}'
              print(f'Validated {name}: {len(data)} bytes ({width}x{height})')
          PY
      - name: Commit six original Gingy illustrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/gingy/
          git diff --cached --quiet && exit 0
          git commit -m "Add six Gingy interactive explainer illustrations [skip ci]"
          git push
